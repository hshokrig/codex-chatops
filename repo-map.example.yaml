repos:
  - slug: mint
    category_name: 10-mint
    session_channel_id: "000000000000000001"
    events_channel_id: "000000000000000002"
    deployments_channel_id: "000000000000000003"
    local_path: /path/to/mint
    default_branch: main
    codex_profile: default
    allowed_users:
      - "123456789012345678"
    allowed_roles:
      - "234567890123456789"
    checks:
      - pnpm test
      - pnpm lint
    deploy_workflows:
      staging:
        workflow_id: deploy-staging.yml
        ref: session-branch
        inputs:
          environment: staging
      production:
        workflow_id: deploy-production.yml
        ref: default-branch
        inputs:
          environment: production
    require_pr_approval: true
    require_prod_confirmation: true
